# Host ports for postgres/redis are shifted off their defaults (55432/56379)
# so this stack doesn't collide with another project's containers already
# bound to 5432/6379 on the same machine. Container-internal ports are
# untouched — only DATABASE_URL / REDIS_URL on the host side need the shift.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB: polaris
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: polaris
      MINIO_ROOT_PASSWORD: polaris123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
